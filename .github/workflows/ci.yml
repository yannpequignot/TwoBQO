name: CI

# Kernel-checks the whole development on every push and pull request, against the pinned
# Mathlib (v4.28.0). Two things beyond a plain compile are asserted by a green run:
#
#  * Mathlib's linter set (`linter.mathlibStandardSet`, enabled in lakefile.lean) is applied to
#    every file, so style regressions surface here.
#  * Each headline theorem is followed by a `#guard_msgs`-wrapped `#print axioms`, so a green
#    build asserts the development uses only the standard axioms — in particular, no `sorry`.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & kernel-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with lean-action
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Check that NashWilliams.lean imports every module
        run: lake exe mk_all --lib NashWilliams --check
